<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Company Website and Compliance">
  <rect width="640" height="360" fill="#14181F"/>
  <g stroke="#2A3038" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
  </g>
  <text x="40" y="64" font-family="'IBM Plex Mono', monospace" font-size="20" fill="#4FA39A">compliance <tspan fill="#5A6472">~</tspan> <tspan fill="#E8A33D">$</tspan> <tspan fill="#C9D1D9">consent --gate</tspan></text>
  <!-- legal document -->
  <g transform="translate(150,110)">
    <rect x="0" y="0" width="150" height="180" rx="10" fill="#232B36" stroke="#2A3038" stroke-width="2"/>
    <line x1="24" y1="36" x2="126" y2="36" stroke="#5A6472" stroke-width="6" stroke-linecap="round"/>
    <line x1="24" y1="62" x2="126" y2="62" stroke="#5A6472" stroke-width="6" stroke-linecap="round"/>
    <line x1="24" y1="88" x2="100" y2="88" stroke="#5A6472" stroke-width="6" stroke-linecap="round"/>
    <line x1="24" y1="114" x2="126" y2="114" stroke="#5A6472" stroke-width="6" stroke-linecap="round"/>
    <line x1="24" y1="140" x2="90" y2="140" stroke="#5A6472" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- cookie with consent check -->
  <g transform="translate(410,200)">
    <circle cx="0" cy="0" r="66" fill="#232B36" stroke="#E8A33D" stroke-width="3"/>
    <circle cx="-24" cy="-20" r="8" fill="#E8A33D"/>
    <circle cx="18" cy="-28" r="6" fill="#E8A33D"/>
    <circle cx="26" cy="8" r="9" fill="#E8A33D"/>
    <circle cx="-8" cy="20" r="6" fill="#E8A33D"/>
    <circle cx="-30" cy="28" r="5" fill="#E8A33D"/>
    <!-- consent check badge -->
    <circle cx="44" cy="-44" r="24" fill="#4FA39A"/>
    <path d="M32 -44 l8 9 l16 -18" fill="none" stroke="#14181F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="332" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#5A6472">cookie consent · legal suite</text>
</svg>
