<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Go Automation Document Collection System">
  <rect width="640" height="360" fill="#14181F"/>
  <!-- subtle grid -->
  <g stroke="#2A3038" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
  </g>
  <!-- terminal prompt -->
  <text x="40" y="64" font-family="'IBM Plex Mono', monospace" font-size="20" fill="#4FA39A">go-automation <tspan fill="#5A6472">~</tspan> <tspan fill="#E8A33D">$</tspan> <tspan fill="#C9D1D9">collect --docs</tspan></text>
  <!-- stacked documents -->
  <g transform="translate(232,120)">
    <rect x="18" y="18" width="128" height="164" rx="10" fill="#1B2029" stroke="#2A3038" stroke-width="2"/>
    <rect x="9" y="9" width="128" height="164" rx="10" fill="#1E242E" stroke="#2A3038" stroke-width="2"/>
    <rect x="0" y="0" width="128" height="164" rx="10" fill="#232B36" stroke="#4FA39A" stroke-width="2"/>
    <line x1="22" y1="40" x2="106" y2="40" stroke="#5A6472" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="64" x2="106" y2="64" stroke="#5A6472" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="88" x2="82" y2="88" stroke="#5A6472" stroke-width="6" stroke-linecap="round"/>
    <!-- check badge -->
    <circle cx="106" cy="128" r="34" fill="#E8A33D"/>
    <path d="M90 128 l12 12 l22 -26" fill="none" stroke="#14181F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="332" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#5A6472">AI-powered · multi-tenant SaaS</text>
</svg>
