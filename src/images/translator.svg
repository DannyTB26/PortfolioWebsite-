<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Translator application">
  <rect width="640" height="360" fill="#14181F"/>
  <g stroke="#2A3038" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
  </g>
  <text x="40" y="64" font-family="'IBM Plex Mono', monospace" font-size="20" fill="#4FA39A">translate <tspan fill="#5A6472">~</tspan> <tspan fill="#E8A33D">$</tspan> <tspan fill="#C9D1D9">en --&gt; es</tspan></text>
  <!-- speech bubble A (amber) -->
  <g transform="translate(150,120)">
    <path d="M0 0 h150 a16 16 0 0 1 16 16 v70 a16 16 0 0 1 -16 16 h-96 l-30 28 v-28 h-24 a16 16 0 0 1 -16 -16 v-70 a16 16 0 0 1 16 -16 Z" fill="#232B36" stroke="#E8A33D" stroke-width="2"/>
    <text x="75" y="72" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="52" fill="#E8A33D">A</text>
  </g>
  <!-- speech bubble 文 (teal) -->
  <g transform="translate(330,150)">
    <path d="M0 0 h150 a16 16 0 0 1 16 16 v70 a16 16 0 0 1 -16 16 h-24 v28 l-30 -28 h-96 a16 16 0 0 1 -16 -16 v-70 a16 16 0 0 1 16 -16 Z" fill="#232B36" stroke="#4FA39A" stroke-width="2"/>
    <text x="83" y="74" text-anchor="middle" font-family="sans-serif" font-size="52" fill="#4FA39A">文</text>
  </g>
  <text x="600" y="332" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#5A6472">Python · hackathon runner-up</text>
</svg>
