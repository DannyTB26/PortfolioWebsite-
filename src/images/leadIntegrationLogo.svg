<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Lead-Integration Bridge">
  <rect width="640" height="360" fill="#14181F"/>
  <g stroke="#2A3038" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
  </g>
  <text x="40" y="64" font-family="'IBM Plex Mono', monospace" font-size="20" fill="#4FA39A">integration <tspan fill="#5A6472">~</tspan> <tspan fill="#E8A33D">$</tspan> <tspan fill="#C9D1D9">webhook --verify</tspan></text>
  <!-- provider node -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="130" height="90" rx="12" fill="#232B36" stroke="#2A3038" stroke-width="2"/>
    <text x="65" y="38" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" fill="#5A6472">provider</text>
    <circle cx="65" cy="60" r="9" fill="#4FA39A"/>
  </g>
  <!-- pipe + arrow -->
  <line x1="200" y1="195" x2="440" y2="195" stroke="#E8A33D" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M432 183 L452 195 L432 207 Z" fill="#E8A33D"/>
  <!-- signature check badge -->
  <g transform="translate(320,195)">
    <circle cx="0" cy="0" r="30" fill="#14181F" stroke="#4FA39A" stroke-width="2"/>
    <path d="M-14 0 l9 10 l18 -20" fill="none" stroke="#4FA39A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- CRM node -->
  <g transform="translate(440,150)">
    <rect x="0" y="0" width="130" height="90" rx="12" fill="#232B36" stroke="#4FA39A" stroke-width="2"/>
    <text x="65" y="38" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" fill="#5A6472">CRM</text>
    <circle cx="52" cy="60" r="7" fill="#E8A33D"/>
    <circle cx="78" cy="60" r="7" fill="#E8A33D"/>
  </g>
  <text x="600" y="332" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#5A6472">webhook → CRM · idempotent</text>
</svg>
