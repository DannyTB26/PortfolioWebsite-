<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Mortgage Bridge CRM">
  <rect width="640" height="360" fill="#14181F"/>
  <g stroke="#2A3038" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
  </g>
  <!-- terminal prompt -->
  <text x="40" y="64" font-family="'IBM Plex Mono', monospace" font-size="20" fill="#4FA39A">mortgage-bridge <tspan fill="#5A6472">~</tspan> <tspan fill="#E8A33D">$</tspan> <tspan fill="#C9D1D9">leads --take</tspan></text>
  <!-- suspension bridge -->
  <g transform="translate(0,40)">
    <!-- deck -->
    <line x1="60" y1="235" x2="580" y2="235" stroke="#4FA39A" stroke-width="5" stroke-linecap="round"/>
    <!-- towers -->
    <line x1="200" y1="235" x2="200" y2="120" stroke="#C9D1D9" stroke-width="6" stroke-linecap="round"/>
    <line x1="440" y1="235" x2="440" y2="120" stroke="#C9D1D9" stroke-width="6" stroke-linecap="round"/>
    <!-- main cables -->
    <path d="M60 175 Q200 250 320 175 Q440 250 580 175" fill="none" stroke="#E8A33D" stroke-width="5"/>
    <path d="M200 120 Q320 205 440 120" fill="none" stroke="#E8A33D" stroke-width="5"/>
    <!-- suspenders -->
    <g stroke="#E8A33D" stroke-width="2" opacity="0.7">
      <line x1="100" y1="197" x2="100" y2="235"/>
      <line x1="140" y1="210" x2="140" y2="235"/>
      <line x1="260" y1="150" x2="260" y2="235"/>
      <line x1="320" y1="176" x2="320" y2="235"/>
      <line x1="380" y1="150" x2="380" y2="235"/>
      <line x1="500" y1="210" x2="500" y2="235"/>
      <line x1="540" y1="197" x2="540" y2="235"/>
    </g>
  </g>
  <text x="600" y="332" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#5A6472">PWA · broker CRM over GoHighLevel</text>
</svg>
